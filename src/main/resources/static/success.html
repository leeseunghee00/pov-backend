<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const API_BASE_URL = 'http://localhost:8080';
    const token = 'Bearer token';   // TODO: 토큰 넣기

    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get('paymentKey');
    const orderId = urlParams.get('orderId');
    const amount = urlParams.get('amount');
    const idempotencyKey = localStorage.getItem('IDEMPOTENCY_KEY');

    if (!paymentKey || !orderId || !amount || !idempotencyKey) {
      console.error('필요한 파라미터가 없습니다.');
      alert('결제 정보가 올바르지 않습니다.');
      window.location.href = '/';
      return;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/api/payments`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': token,
          'Idempotency-Key': idempotencyKey
        },
        body: JSON.stringify({
          paymentKey,
          orderId,
          amount: 50000
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || '결제 승인 요청 실패');
      }

      alert('결제가 성공적으로 완료되었습니다.');
      localStorage.removeItem('IDEMPOTENCY_KEY'); // 사용 후 삭제
      window.location.href = '/';
    } catch (error) {
      console.error('결제 승인 요청 실패:', error);
      alert(error.message || '결제 승인 요청에 실패했습니다. 관리자에게 문의하세요.');
      window.location.href = '/';
    }
  });
</script>
