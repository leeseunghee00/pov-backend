<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 테스트</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>
<section>
    <h1>상품 결제 테스트</h1>
    <div>
        <span>상품 가격: </span>
        <span>50,000원</span>
    </div>
    <button id="entry-button">응모하기</button>
    <button id="payment-button" disabled>결제하기</button>
</section>

<script>
    const clientKey = 'test_ck_'; // TODO: 키 값 넣기
    const tossPayments = TossPayments(clientKey);
    const API_BASE_URL = 'http://localhost:8080';

    let orderId = null;
    const quantity = 1;
    const amount = 50000;

    const token = 'Bearer token';   // TODO: 토큰 넣기

    // Step 1: 응모하기
    document.getElementById('entry-button').addEventListener('click', async () => {
        const premiereId = 1;

        try {
            const response = await fetch(`${API_BASE_URL}/api/premieres/${premiereId}/entry`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token
                },
                body: JSON.stringify({ quantity, amount })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || '응모하기 실패');
            }

            const data = await response.json();
            orderId = data.data.orderId;
            idempotencyKey = data.data.idempotencyKey;
            localStorage.setItem('IDEMPOTENCY_KEY', idempotencyKey);
            console.log('응모 성공, orderId:', orderId);

            alert('응모가 성공적으로 완료되었습니다. 이제 결제를 진행해 주세요.');
            document.getElementById('payment-button').disabled = false;

        } catch (error) {
            console.error('응모 오류:', error);
            alert(error.message || '응모 중 오류가 발생했습니다.');
        }
    });

    // Step 2: 결제하기
    document.getElementById('payment-button').addEventListener('click', async () => {
        if (!orderId) {
            alert('응모가 완료되지 않았습니다. 먼저 응모를 진행하세요.');
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/payments/temp`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token
                },
                body: JSON.stringify({ orderId, amount })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || '임시 결제 저장 실패');
            }

            console.log('임시 결제 데이터 저장 성공:', orderId);

            // 토스페이먼츠 결제 요청
            tossPayments.requestPayment('카드', {
                amount,
                orderId,
                orderName: '테스트 상품 구매',
                customerName: '밥줘명수옹',
                customerEmail: 'asdf@asdf.com',
                successUrl: `${API_BASE_URL}/success.html`,
                failUrl: `${API_BASE_URL}/fail`
            });
        } catch (error) {
            console.error('결제 요청 오류:', error);
            alert(error.message || '결제 요청 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
